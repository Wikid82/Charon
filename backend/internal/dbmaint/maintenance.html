<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Optimizing the database</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--fg:#1d2330;--muted:#5b6475;--card:#fff;--accent:#2f6fed}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--fg:#e8ebf2;--muted:#9aa4b8;--card:#181e2a;--accent:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:30rem;width:100%;padding:2rem;border-radius:12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.12);text-align:center}
h1{margin:0 0 .75rem;font-size:1.4rem}
p{margin:.5rem 0;color:var(--muted)}
.spinner{width:2.25rem;height:2.25rem;margin:0 auto 1rem;border:4px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main role="status" aria-live="polite">
<div class="spinner" aria-hidden="true"></div>
<h1>Optimizing the database</h1>
<p>This can take a few minutes. Your proxies are still running.</p>
<p>This page refreshes by itself when Charon is ready.</p>
<noscript><p>Reload this page in a few minutes.</p></noscript>
</main>
<script>
(function(){
function poll(){
fetch('/api/v1/maintenance/status',{cache:'no-store',headers:{Accept:'application/json'}})
.then(function(r){return r.json();})
.then(function(s){if(s&&s.active===false){location.reload();}})
.catch(function(){});
}
setInterval(poll,5000);
})();
</script>
</body>
</html>
