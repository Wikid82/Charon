services:
  charon:
    image: charon:local
    container_name: charon
    restart: unless-stopped
    # Time for Charon's graceful shutdown (job drain, server stop) before docker sends SIGKILL.
    stop_grace_period: 30s
    ports:
      - "80:80"        # HTTP (Caddy proxy)
      - "443:443"      # HTTPS (Caddy proxy)
      - "443:443/udp"  # HTTP/3 (Caddy proxy)
      - "8080:8080"    # Management UI (Charon)
      - "2345:2345"    # Delve Debugger
    environment:
      - CHARON_ENV=development
      - CHARON_DEBUG=1
      - TZ=America/New_York
      # Generate with: openssl rand -base64 32
      - CHARON_ENCRYPTION_KEY=your-32-byte-base64-key-here
      - CHARON_HTTP_PORT=8080
      - CHARON_DB_PATH=/app/data/charon.db
      - CHARON_FRONTEND_DIR=/app/frontend/dist
      - CHARON_CADDY_CONFIG_DIR=/app/data/caddy
      - CHARON_CADDY_BINARY=caddy
      - CHARON_IMPORT_CADDYFILE=/import/Caddyfile
      - CHARON_IMPORT_DIR=/app/data/imports
      - CHARON_ACME_STAGING=false
      - FEATURE_CERBERUS_ENABLED=true
      # Emergency "break-glass" token for security reset when ACL blocks access.
      # Supplied from .env (gitignored); Compose reads .env from this file's directory,
      # or pass --env-file <path> when the file lives elsewhere (e.g. the repo root).
      - CHARON_EMERGENCY_TOKEN=${CHARON_EMERGENCY_TOKEN:?set CHARON_EMERGENCY_TOKEN in .env - generate with openssl rand -hex 32}
    # Docker socket group access: copy docker-compose.override.example.yml
    # to docker-compose.override.yml and set your host's docker GID.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - charon_data:/app/data
      - caddy_data:/data
      - caddy_config:/config
      - crowdsec_data:/app/data/crowdsec
      - plugins_data:/app/plugins # Read-write for development/hot-loading
      # Optional: direct local discovery. Orthrus (docs/features/orthrus.md) is the recommended, safer option.
      - ./backend:/app/backend:ro # Mount source for debugging
      # Mount your existing Caddyfile for automatic import (optional)
#      - <PATH_TO_YOUR_CADDYFILE>:/import/Caddyfile:ro
#      - <PATH_TO_YOUR_SITES_DIR>:/import/sites:ro # If your Caddyfile imports other files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  orthrus-agent:
    image: wikid82/orthrus:latest
    container_name: orthrus
    restart: always
    environment:
      # The websocket URL of your Charon instance. Use wss://charon.example.com when Charon is behind HTTPS (a reverse proxy with a certificate),
      # or ws://<host>:<port> (e.g. ws://100.x.y.z:8080) when connecting to Charon directly over HTTP, such as on Tailscale or a Docker network.
      # Charon itself does not serve TLS, so wss:// to its plain HTTP port fails with "first record does not look like a TLS handshake".
      - ORTHRUS_SERVER_URL=${ORTHRUS_SERVER_URL}
      # The agent UUID shown when you registered this agent in Charon (Remote Agents -> Add Agent)
      - ORTHRUS_AGENT_ID=${ORTHRUS_AGENT_ID}
      # The one-time auth key shown when you registered this agent
      - ORTHRUS_AGENT_ID=${ORTHRUS_AGENT_ID}
    volumes:
      # Give the agent read-only access to the host Docker socket. The agent is read-only by default;
      # write access is an explicit per-agent opt-in in Charon (see docs/features/orthrus.md).
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro

volumes:
  charon_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  crowdsec_data:
    driver: local
  plugins_data:
    driver: local
