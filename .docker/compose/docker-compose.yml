services:
  charon:
    # Override for local testing:
    # CHARON_IMAGE=ghcr.io/wikid82/charon:latest
    image: wikid82/charon:latest
    container_name: charon
    restart: unless-stopped
    # Time for Charon's graceful shutdown (job drain, server stop) before docker sends SIGKILL.
    stop_grace_period: 30s
    ports:
      - "80:80"        # HTTP (Caddy proxy)
      - "443:443"      # HTTPS (Caddy proxy)
      - "443:443/udp"  # HTTP/3 (Caddy proxy)
      - "8080:8080"    # Management UI (Charon). Behind a reverse proxy? See CHARON_TRUSTED_PROXIES below
      # Emergency server port - ONLY expose via SSH tunnel or VPN for security
      # Uncomment ONLY if you need localhost access on host machine:
      # - "127.0.0.1:2020:2020"  # Emergency server Tier-2 (localhost-only)
    environment:
      - CHARON_ENV=production # CHARON_ preferred; CPM_ values still supported
      - TZ=UTC # Set timezone (e.g., America/New_York)
      # Reaching Charon through another reverse proxy? List that proxy's exact address so Charon
      # sees your visitors' real addresses (login protection counts visitors separately).
      # See docs/configuration/trusted-proxies.md
      # - CHARON_TRUSTED_PROXIES=<your proxy's IP>/32
      # Generate with: openssl rand -base64 32
      - CHARON_ENCRYPTION_KEY=your-32-byte-base64-key-here
      # Emergency break glass configuration (Tier 1 & Tier 2)
      # Tier 1: Emergency token for Layer 7 bypass within application
      # Generate with: openssl rand -hex 32
      # - CHARON_EMERGENCY_TOKEN=${CHARON_EMERGENCY_TOKEN}  # Store in secrets manager
      # Tier 2: Emergency server on separate port (bypasses Caddy/CrowdSec entirely)
      # - CHARON_EMERGENCY_SERVER_ENABLED=false  # Disabled by default
      # - CHARON_EMERGENCY_BIND=127.0.0.1:2020   # Localhost only (port 2020)
      # - CHARON_EMERGENCY_USERNAME=admin
      # - CHARON_EMERGENCY_PASSWORD=${EMERGENCY_PASSWORD}  # Store in secrets manager
      - CHARON_HTTP_PORT=8080
      - CHARON_DB_PATH=/app/data/charon.db
      - CHARON_FRONTEND_DIR=/app/frontend/dist
      - CHARON_CADDY_CONFIG_DIR=/app/data/caddy
      - CHARON_CADDY_BINARY=caddy
      - CHARON_IMPORT_CADDYFILE=/import/Caddyfile
      - CHARON_IMPORT_DIR=/app/data/imports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cpm_data:/app/data # existing data (legacy name); charon will also use this path by default for backward compatibility
      - caddy_data:/data
      - caddy_config:/config
      - crowdsec_data:/app/data/crowdsec
      - plugins_data:/app/plugins:ro # Read-only in production for security
      # Optional: only needed for direct local container discovery. Orthrus (docs/features/orthrus.md)
      # is the recommended, more secure way to connect Docker; remove this line if you use it.
      # - ${DOCKER_SOCK}:/var/run/docker.sock:ro # For local container discovery
      # Mount your existing Caddyfile for automatic import (optional)
      # - ./my-existing-Caddyfile:/import/Caddyfile:ro
      # - ./sites:/import/sites:ro # If your Caddyfile imports other files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  orthrus:
    image: wikid82/orthrus:latest
    restart: always
    container_name: orthrus
    environment:
      # User and group the agent runs as. PGID must match your Docker socket's group (see docs/features/orthrus.md).
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # The websocket URL of your Charon instance. Use wss://charon.example.com when Charon is behind HTTPS (a reverse proxy with a certificate),
      # or ws://<host>:<port> (e.g. ws://100.x.y.z:8080) when connecting to Charon directly over HTTP, such as on Tailscale or a Docker network.
      # Charon itself does not serve TLS, so wss:// to its plain HTTP port fails with "first record does not look like a TLS handshake".
      - ORTHRUS_SERVER_URL=${ORTHRUS_SERVER_URL}
      # The agent ID shown when you registered this agent in Charon (Hecate -> Agent -> Add Agent)
      - ORTHRUS_AGENT_ID=${ORTHRUS_AGENT_ID}
      # The one-time auth key shown when you registered this agent
      - ORTHRUS_AUTH_KEY=${ORTHRUS_AUTH_KEY}
    volumes:
      # Read-only access to the host Docker socket (DOCKER_SOCK in your .env). The agent is read-only by default;
      # write access is an explicit per-agent opt-in in Charon (see docs/features/orthrus.md).
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro

volumes:
  cpm_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  crowdsec_data:
    driver: local
  plugins_data:
    driver: local
