# Development override - use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  charon:
    # Override for local testing:
    # CHARON_DEV_IMAGE=ghcr.io/wikid82/charon:dev
    image: wikid82/charon:dev
    # Time for Charon's graceful shutdown (job drain, server stop) before docker sends SIGKILL.
    stop_grace_period: 30s
    # Development: the Caddy admin API is not published; read it inside the container (docker exec)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
      # Caddy admin API stays inside the container: docker compose exec app /app/charon caddy-admin get /config/
    environment:
      - CHARON_ENV=development
      - CPM_ENV=development
      - CHARON_HTTP_PORT=8080
      - CPM_HTTP_PORT=80
      # Generate with: openssl rand -base64 32
      - CHARON_ENCRYPTION_KEY=your-32-byte-base64-key-here
      - CHARON_DB_PATH=/app/data/charon.db
      - CHARON_FRONTEND_DIR=/app/frontend/dist
      - CHARON_CADDY_CONFIG_DIR=/app/data/caddy
      # Security Services (Optional)
      # 🚨 DEPRECATED: Use GUI toggle in Security dashboard instead
      #- CPM_SECURITY_CROWDSEC_MODE=disabled # ⚠️ DEPRECATED
      #- CPM_SECURITY_WAF_MODE=disabled
      #- CPM_SECURITY_RATELIMIT_ENABLED=false
      #- CPM_SECURITY_ACL_ENABLED=false
      - FEATURE_CERBERUS_ENABLED=true
    # Docker socket group access: copy docker-compose.override.example.yml
    # to docker-compose.override.yml and set your host's docker GID.
    volumes:
      # Dev flow uses direct local discovery. For real deployments Orthrus (docs/features/orthrus.md) is recommended.
      - crowdsec_data:/app/data/crowdsec
      # Mount your existing Caddyfile for automatic import (optional)
      # - ./my-existing-Caddyfile:/import/Caddyfile:ro
      # - ./sites:/import/sites:ro # If your Caddyfile imports other files

  orthrus:
    image: wikid82/orthrus:latest
    restart: always
    container_name: orthrus
    environment:
      # User and group the agent runs as. PGID must match your Docker socket's group (see docs/features/orthrus.md).
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # The websocket URL of your Charon instance. Use wss://charon.example.com when Charon is behind HTTPS (a reverse proxy with a certificate),
      # or ws://<host>:<port> (e.g. ws://100.x.y.z:8080) when connecting to Charon directly over HTTP, such as on Tailscale or a Docker network.
      # Charon itself does not serve TLS, so wss:// to its plain HTTP port fails with "first record does not look like a TLS handshake".
      - ORTHRUS_SERVER_URL=${ORTHRUS_SERVER_URL}
      # The agent ID shown when you registered this agent in Charon (Hecate -> Agent -> Add Agent)
      - ORTHRUS_AGENT_ID=${ORTHRUS_AGENT_ID}
      # The agent reads its key from the orthrus_auth_key file (a Compose secret, below) before it drops privileges.
      # Save the key next to this file first: printf '%s' '<your-key>' > orthrus_auth_key && chmod 600 orthrus_auth_key
      - ORTHRUS_AUTH_KEY_FILE=/run/secrets/orthrus_auth_key
    secrets:
      - orthrus_auth_key
    volumes:
      # Read-only access to the host Docker socket (DOCKER_SOCK in your .env). The agent is read-only by default;
      # write access is an explicit per-agent opt-in in Charon (see docs/features/orthrus.md).
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro

secrets:
  orthrus_auth_key:
    file: ./orthrus_auth_key

volumes:
  crowdsec_data:
    driver: local
