name: Deploy Documentation to GitHub Pages

on:
  workflow_run:
    workflows: ["Docker Build, Publish & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # Allow manual trigger

# Sets permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}"
  cancel-in-progress: false

env:
  NODE_VERSION: '24.20.0'

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      # Step 1: Get the code
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Step 2: Set up Node.js (for building any JS-based doc tools)
      - name: 🔧 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Step 3: Create a beautiful docs site structure
      # All site-assembly logic (markdown conversion, per-page nav/SEO wrap,
      # path fixes, sitemap + robots) lives in .github/pages/build-docs.sh —
      # extracted out of this step because a large inline heredoc here hangs
      # actionlint's shellcheck integration (same reason docs-index.html was
      # extracted). Inputs are passed via env: REPO_NAME (job-level env, below)
      # and GITHUB_REPOSITORY (provided automatically by the runner).
      - name: 📝 Build documentation site
        run: |
          npm install -g marked
          bash .github/pages/build-docs.sh

      # Step 4: Upload the built site
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      needs.build.result == 'success' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build

    steps:
      # Deploy to GitHub Pages
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # Create a summary
      - name: 📋 Create deployment summary
        run: |
          {
            echo "## 🎉 Documentation Deployed!"
            echo ""
            echo "Your documentation is now live at:"
            echo "🔗 ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "### 📚 What's Included"
            echo "- Getting Started Guide"
            echo "- Complete README"
            echo "- API Documentation"
            echo "- Database Schema"
            echo "- Import Guide"
            echo "- Contributing Guidelines"
          } >> "$GITHUB_STEP_SUMMARY"
