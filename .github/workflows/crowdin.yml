name: Crowdin Action

on:
  push:
    branches: [ development ]
    paths:
      - 'frontend/src/locales/en/translation.json'
      - 'crowdin.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: crowdin action
        uses: crowdin/github-action@72955432d4aa4f6dd64cf17eeb88dd34d6ba064c # v3
        with:
          upload_sources: true
          # One-time seed of the existing translations; set to false once the first sync has landed
          # so repo files never overwrite work done by translators in Crowdin.
          upload_translations: true
          download_translations: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          commit_message: 'chore(i18n): update translations'
          pull_request_title: 'chore(i18n): update translations'
          pull_request_body: 'New Crowdin translations by [Crowdin GH Action](https://github.com/crowdin/github-action)'
          # The localization branch is cut from development, so the PR must target it too;
          # targeting main would pull every unpromoted development commit into the diff.
          pull_request_base_branch_name: 'development'
        env:
          # Fine-grained PAT (Contents + Pull requests: read/write). The default GITHUB_TOKEN
          # cannot be used: PRs it opens do not trigger CI workflows.
          GITHUB_TOKEN: ${{ secrets.CROWDIN_TOKEN }}

          # A numeric ID, found at https://crowdin.com/project/<projectName>/tools/api
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}

          # Visit https://crowdin.com/settings#api-key to create this token
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
