name: Deploy Documentation Site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:   # Allow manual trigger

# Sets permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Step 1: Get the code
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Step 2: Set up Python (docs tooling only; Zensical is not part of the Charon app or container)
      - name: 🔧 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: docs-site/requirements.txt

      # Step 3: Install the pinned docs toolchain
      - name: 📦 Install dependencies
        run: python -m pip install -r docs-site/requirements.txt

      # Step 4: Copy the curated docs/ allowlist into docs-site/docs/ (fails loudly on a bad manifest or nav)
      - name: 📚 Sync documentation sources
        run: bash docs-site/scripts/sync-docs.sh

      # Step 5: Build the site with broken-link and broken-anchor checks enabled
      - name: 📝 Build documentation site
        working-directory: docs-site
        run: |
          zensical build --strict
          touch site/.nojekyll

      # Step 6: Upload the built site
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'docs-site/site'

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build

    steps:
      # Deploy to GitHub Pages
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
