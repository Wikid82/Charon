name: Upload Coverage to Codecov

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_backend:
        description: 'Run backend coverage upload'
        required: false
        default: true
        type: boolean
      run_frontend:
        description: 'Run frontend coverage upload'
        required: false
        default: true
        type: boolean
      run_agent:
        description: 'Run agent coverage upload'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.13.1'
  GOTOOLCHAIN: auto
  # Shard counts for the unit-test matrices; keep in sync with the matrix lists.
  BACKEND_TEST_SHARDS: '3'
  FRONTEND_TEST_SHARDS: '4'

permissions:
  contents: read
  pull-requests: write

jobs:
  # The Go suite runs as parallel shards (scripts/ci/shard-go-packages.sh). Each
  # shard uploads its coverage profile; `backend-codecov` merges them, enforces
  # the coverage gate once, and stages the merged profile for upload-codecov.
  backend-codecov-shards:
    name: Backend Codecov Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_backend }}
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with BACKEND_TEST_SHARDS below.
        shard: [1, 2, 3]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      # The backend tests need only a valid 32-byte key. It is generated per run and kept in
      # this step's output, so no repository secret is read, which keeps fork and Dependabot PRs
      # and same-repository PRs on the same path.
      - name: Generate encryption key for backend coverage
        id: test-key
        shell: bash
        run: |
          set -euo pipefail
          encryption_key="$(openssl rand -base64 32)"
          echo "::add-mask::${encryption_key}"
          echo "encryption_key=${encryption_key}" >> "$GITHUB_OUTPUT"

      - name: Run backend coverage shard
        uses: ./.github/actions/go-coverage-shard
        with:
          shard-index: ${{ matrix.shard }}
          shard-total: ${{ env.BACKEND_TEST_SHARDS }}
          encryption-key: ${{ steps.test-key.outputs.encryption_key }}

  backend-codecov:
    name: Backend Codecov Upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-codecov-shards]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_backend }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Merge backend coverage shards and enforce the gate
        uses: ./.github/actions/go-coverage-merge
        with:
          expected-shards: ${{ env.BACKEND_TEST_SHARDS }}

      - name: Upload test output artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-output
          path: backend/test-output.txt
          retention-days: 7

      - name: Stage backend coverage for upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/coverage.txt
          if-no-files-found: error
          retention-days: 1

  # The Vitest suite runs as parallel shards, each uploading a blob report.
  # `frontend-codecov` merges them, enforces the coverage threshold once, and
  # stages lcov.info for upload-codecov.
  frontend-codecov-shards:
    name: Frontend Codecov Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_frontend }}
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with FRONTEND_TEST_SHARDS below.
        shard: [1, 2, 3, 4]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend coverage shard
        uses: ./.github/actions/vitest-coverage-shard
        with:
          shard-index: ${{ matrix.shard }}
          shard-total: ${{ env.FRONTEND_TEST_SHARDS }}

  frontend-codecov:
    name: Frontend Codecov Upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-codecov-shards]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_frontend }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Merge frontend coverage shards and enforce the threshold
        uses: ./.github/actions/vitest-coverage-merge
        with:
          expected-shards: ${{ env.FRONTEND_TEST_SHARDS }}

      - name: Stage frontend coverage for upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  agent-codecov:
    name: Agent Codecov Upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_agent }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # No "Resolve encryption key" step: agent has no encryption-key
      # bootstrapping (consistent with quality-checks.yml's agent-quality
      # job) — agent's tests don't read the backend encryption key.
      # No CGO_ENABLED: 1 either: agent/'s Docker image builds with
      # CGO_ENABLED=0 (FROM scratch), so there is no cgo dependency here.

      - name: Run Go tests with coverage
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/agent-test-coverage.sh 2>&1 | tee agent/test-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload test output artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-test-output
          path: agent/test-output.txt
          retention-days: 7

      - name: Stage agent coverage for upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-agent
          path: agent/coverage.txt
          if-no-files-found: error
          retention-days: 1

  # The test jobs above only stage their coverage file as an artifact. Codecov
  # re-evaluates statuses on every upload, so uploading from three parallel jobs
  # (agent in ~2 min, backend in ~15 min) made codecov/patch flap red/green.
  # This job uploads all reports back to back once every test job is done, so
  # Codecov never sees a partial report (only a seconds-wide window between the
  # three uploads remains).
  #
  # Runs only if no test job failed/was cancelled and at least one succeeded.
  # A workflow_dispatch with a job disabled (skipped) still uploads, but only
  # the reports that exist, so Codecov computes from a partial report. If a test
  # job fails, nothing is uploaded and no codecov/* status is posted.
  upload-codecov:
    name: Codecov Upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-codecov-shards, backend-codecov, frontend-codecov-shards, frontend-codecov, agent-codecov]
    if: >-
      ${{ !cancelled()
      && !contains(needs.*.result, 'failure')
      && contains(needs.*.result, 'success') }}
    steps:
      # Checkout at the tested SHA is required so Codecov can map report paths.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download backend coverage
        if: ${{ needs.backend-codecov.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-backend
          path: backend

      - name: Download frontend coverage
        if: ${{ needs.frontend-codecov.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Download agent coverage
        if: ${{ needs.agent-codecov.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-agent
          path: agent

      - name: Upload backend coverage to Codecov
        if: ${{ needs.backend-codecov.result == 'success' }}
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.txt
          flags: backend
          fail_ci_if_error: true

      - name: Upload frontend coverage to Codecov
        if: ${{ needs.frontend-codecov.result == 'success' }}
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Upload agent coverage to Codecov
        if: ${{ needs.agent-codecov.result == 'success' }}
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./agent/coverage.txt
          flags: agent
          fail_ci_if_error: true
