name: Weekly Security Rebuild

# Note: This workflow filename has remained consistent. The related docker-publish.yml
# was replaced by docker-build.yml in commit f640524b (Dec 21, 2025).
# GitHub Advanced Security may show warnings about the old filename until its tracking updates.
#
# Since the prebuilt-toolchain-image change this workflow no longer builds a
# throwaway `charon:security-scan-YYYYMMDD` app image that nothing consumes. It
# drives the SAME deterministic `--no-cache --pull` rebuild + blocking Trivy
# CRITICAL/HIGH gate + digest-bump bot PR as the daily schedule, by
# `workflow_call`ing toolchain-image.yml, then adds the fuller MEDIUM/LOW JSON
# report artifact + installed-package table the weekly slot has always produced.

on:
  schedule:
    - cron: '0 12 * * 2' # Tuesdays at 12:00 UTC
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild without cache'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deterministic --no-cache --pull rebuild + publish + blocking Trivy
  # CRITICAL/HIGH gate + :trivy-toolchain SARIF + (if the digest moved)
  # bot/bump-toolchain-image PR. N6: a workflow_call'ed workflow cannot request
  # perms the caller did not grant, so grant everything toolchain-image.yml's
  # open-bump-pr job needs.
  toolchain-rebuild:
    name: Toolchain rebuild + scan
    uses: ./.github/workflows/toolchain-image.yml
    permissions:
      contents: write
      packages: write
      security-events: write
      pull-requests: write
      issues: write
    with:
      # The weekly slot always forces a clean deterministic rebuild.
      force_rebuild: true

  extended-report:
    name: Extended Trivy report (MEDIUM/LOW + package table)
    needs: toolchain-rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      TOOLCHAIN_REF: ghcr.io/${{ github.repository_owner }}/charon-toolchain@${{ needs.toolchain-rebuild.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Normalize image ref
        run: |
          echo "TOOLCHAIN_REF=$(echo "$TOOLCHAIN_REF" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy (JSON, all severities) for the artifact
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TOOLCHAIN_REF }}
          format: 'json'
          output: 'trivy-toolchain-weekly.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          version: 'v0.74.0'

      - name: Upload Trivy JSON results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-toolchain-weekly-${{ github.run_number }}
          path: trivy-toolchain-weekly.json
          retention-days: 90

      - name: Installed package versions (key security packages)
        run: |
          {
            echo "## 📦 Bundled toolchain — key package versions"
            echo ""
            echo '```'
            docker run --rm --entrypoint "" "${TOOLCHAIN_REF}" \
              sh -c "apk info -v 2>/dev/null | grep -E 'zlib|openssl|libcrypto|libssl|musl|xz' || echo 'no matching apk packages (scratch/distroless layers)'" \
              || echo "toolchain image has no shell — inspect via the JSON artifact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Weekly rebuild summary
        if: always()
        run: |
          {
            echo "## 🔒 Weekly Toolchain Rebuild Complete"
            echo ""
            echo "- **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "- **Toolchain key:** \`${{ needs.toolchain-rebuild.outputs.key }}\`"
            echo "- **Digest:** \`${{ needs.toolchain-rebuild.outputs.digest }}\`"
            echo "- **Blocking CRITICAL/HIGH gate:** ran in the reusable toolchain-image workflow"
            echo "- **SARIF:** uploaded under category .github/workflows/toolchain-image.yml:trivy-toolchain"
            echo ""
            echo "If the digest moved, bot/bump-toolchain-image has been opened."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Weekly toolchain rebuild / extended scan failed. Review the Security tab and the run log."
