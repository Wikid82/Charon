name: Propagate Changes Between Branches

on:
  workflow_run:
    workflows: ["Docker Build, Publish & Test"]
    types: [completed]
    branches: [ main, development ]
  # NOTE for future contributors: do not add a direct `push:` trigger here as
  # a workflow_run-reliability fallback without ALSO updating the job-level
  # `if:` below. The CURRENT_BRANCH/CURRENT_SHA env fallbacks (`|| github.ref_name`
  # / `|| github.sha`) already resolve correctly on a `push` event, but the
  # `if:` only recognizes `workflow_dispatch` or a matching `workflow_run` —
  # it has no `github.event_name == 'push'` clause, so a bare `push:` addition
  # would silently no-op the job on every push (worse than today: it would
  # show as a registered trigger in the Actions UI while never actually
  # running). workflow_run is also semantically correct here regardless: this
  # job should only propagate a commit Docker Build has already validated as
  # successful, which a raw `push` event can't guarantee. The existing
  # `workflow_dispatch: {}` below (added in 5245858a) is the intended manual
  # fallback if workflow_run ever silently fails to fire again.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.19.0'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propagate:
    name: Create PR to synchronize branches
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'development')))
    steps:
      - name: Set up Node (for github-script)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Propagate Changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CURRENT_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHARON_TOKEN: ${{ secrets.CHARON_TOKEN }}
        with:
          script: |
            const currentBranch = process.env.CURRENT_BRANCH || context.ref.replace('refs/heads/', '');
            let excludedBranch = null;

            // Loop Prevention: Identify if this commit is from a merged PR
            try {
                const associatedPRs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                  commit_sha: process.env.CURRENT_SHA || context.sha,
              });

              // If the commit comes from a PR, we identify the source branch
              // so we don't try to merge changes back into it immediately.
              if (associatedPRs.data.length > 0) {
                excludedBranch = associatedPRs.data[0].head.ref;
                core.info(`Commit ${process.env.CURRENT_SHA || context.sha} is associated with PR #${associatedPRs.data[0].number} coming from '${excludedBranch}'. This branch will be excluded from propagation to prevent loops.`);
              }
            } catch (err) {
              core.warning(`Failed to check associated PRs: ${err.message}`);
            }

            async function createPR(src, base) {
              if (src === base) return;

              core.info(`Checking propagation from ${src} to ${base}...`);

              // Check for existing open PRs
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${src}`,
                base: base,
              });

              if (pulls.length > 0) {
                core.info(`Existing PR found for ${src} -> ${base}. Skipping.`);
                return;
              }

              // Compare commits to see if src is ahead of base
              let sensitiveFiles = [];
              try {
                const compare = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: base,
                  head: src,
                });

                // If src is not ahead, nothing to merge
                if (compare.data.ahead_by === 0) {
                  core.info(`${src} is not ahead of ${base}. No propagation needed.`);
                  return;
                }

                // If files changed include history-rewrite or other sensitive scripts,
                // flag them for manual review below rather than skipping PR creation
                // outright. A single unrelated sensitive-path file used to block the
                // *entire* diff from propagating, even when it was bundled with
                // otherwise-safe changes (CI/dependency fixes) — that already caused a
                // dropped propagation once (PR #1261: 4 unrelated .github/skills/ files
                // blocked the auto-PR, a human had to manually recreate it, and that
                // manual PR was later closed unmerged). A blocked auto-PR is silent and
                // fragile; an annotated one at least surfaces for review.
                let originalFiles = (compare.data.files || []).map(f => f.filename || '');
                let files = originalFiles.map(f => f.toLowerCase());

                // Fallback: if compare.files is empty/truncated, aggregate files from the commit list
                if (files.length === 0 && Array.isArray(compare.data.commits) && compare.data.commits.length > 0) {
                  originalFiles = [];
                  for (const commit of compare.data.commits) {
                    const commitData = await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: commit.sha });
                    for (const f of (commitData.data.files || [])) {
                      originalFiles.push(f.filename || '');
                    }
                  }
                  originalFiles = Array.from(new Set(originalFiles));
                  files = originalFiles.map(f => f.toLowerCase());
                }

                // Load propagation config (list of sensitive paths) from .github/propagate-config.yml when available
                // NOTE: .github/workflows/ was removed from defaults - workflow updates SHOULD propagate
                // to ensure downstream branches have correct CI/CD configurations
                let configPaths = ['scripts/history-rewrite/', 'data/backups', 'docs/plans/history_rewrite.md'];
                try {
                  const configResp = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: '.github/propagate-config.yml', ref: src });
                  const contentStr = Buffer.from(configResp.data.content, 'base64').toString('utf8');
                  const lines = contentStr.split(/\r?\n/);
                  let inSensitive = false;
                  const parsedPaths = [];
                  for (const line of lines) {
                    const trimmed = line.trim();
                    if (!inSensitive && trimmed.startsWith('sensitive_paths:')) { inSensitive = true; continue; }
                    if (inSensitive) {
                      if (trimmed.startsWith('-')) parsedPaths.push(trimmed.substring(1).trim());
                      else if (trimmed.length === 0) continue; else break;
                    }
                  }
                  if (parsedPaths.length > 0) configPaths = parsedPaths.map(p => p.toLowerCase());
                } catch (err) { core.info('No .github/propagate-config.yml or parse failure; using defaults.'); }

                sensitiveFiles = files
                  .map((fn, idx) => (configPaths.some(sp => fn.startsWith(sp) || fn.includes(sp)) ? originalFiles[idx] : null))
                  .filter(Boolean);

                if (sensitiveFiles.length > 0) {
                  const preview = sensitiveFiles.slice(0, 25).join(', ');
                  const suffix = sensitiveFiles.length > 25 ? ` …(+${sensitiveFiles.length - 25} more)` : '';
                  core.info(`${src} -> ${base} touches sensitive paths (${preview}${suffix}). PR will still be created, flagged for manual review.`);
                }
              } catch (error) {
                // If base branch doesn't exist, etc.
                core.warning(`Error comparing ${src} to ${base}: ${error.message}`);
                return;
              }

              // Create PR. A sensitive-path match no longer blocks creation (see above) —
              // it only prepends a review warning to the PR body.
              try {
                const isSensitive = sensitiveFiles.length > 0;
                let body = `Automated PR to propagate changes from ${src} into ${base}.\n\nTriggered by push to ${currentBranch}.`;
                if (isSensitive) {
                  const preview = sensitiveFiles.slice(0, 25).join(', ');
                  const suffix = sensitiveFiles.length > 25 ? ` …(+${sensitiveFiles.length - 25} more)` : '';
                  body = `⚠️ This propagation touches sensitive paths that need manual review before merging: \`${preview}${suffix}\`\n\n${body}`;
                }

                const pr = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `Propagate changes from ${src} into ${base}`,
                  head: src,
                  base: base,
                  body,
                  // Sensitive-path PRs stay draft for a human to review and merge
                  // manually. Safe PRs are opened ready-for-review and we attempt to
                  // enable native auto-merge on them below.
                  draft: isSensitive,
                });
                core.info(`Created PR #${pr.data.number} to merge ${src} into ${base}${isSensitive ? ' (draft, flagged for manual review)' : ''}`);
                // Add an 'auto-propagate' label to the created PR and create the label if missing
                try {
                  try {
                    await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'auto-propagate' });
                  } catch (e) {
                    await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'auto-propagate', color: '7dd3fc', description: 'Automatically created propagate PRs' });
                  }
                  await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.data.number, labels: ['auto-propagate'] });
                } catch (labelErr) {
                  core.warning('Failed to ensure or add auto-propagate label: ' + labelErr.message);
                }

                // Attempt to enable GitHub's native auto-merge for safe (non-sensitive)
                // propagation PRs, so they don't require a human to notice and click
                // merge. This repo only allows merge commits (allow_squash_merge and
                // allow_rebase_merge are both false), matching the existing nightly ->
                // main weekly promotion policy of always using "Create a merge commit",
                // so we request MERGE here too — never SQUASH or REBASE.
                //
                // NOTE: as of this change, the repo-level "Allow auto-merge" setting
                // (Settings > General > Pull Requests > Allow auto-merge) is OFF, so
                // this mutation will fail (as a caught, non-fatal warning) until that
                // setting is turned on. Flipping that setting is a deliberate, separate
                // repo-administration decision — this code is written to be correct and
                // inert until then, not to attempt it itself.
                if (!isSensitive) {
                  try {
                    await github.graphql(
                      `mutation($pullRequestId: ID!) {
                        enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: MERGE }) {
                          pullRequest { autoMergeRequest { enabledAt } }
                        }
                      }`,
                      { pullRequestId: pr.data.node_id }
                    );
                    core.info(`Auto-merge enabled for PR #${pr.data.number}`);
                  } catch (mergeErr) {
                    core.warning(`Could not enable auto-merge for PR #${pr.data.number} — check repo Settings > Pull Requests > Allow auto-merge. (${mergeErr.message})`);
                  }
                }
              } catch (error) {
                core.warning(`Failed to create PR from ${src} to ${base}: ${error.message}`);
              }
            }

            if (currentBranch === 'main') {
              // Main -> Development
              // Only propagate if development is not the source (loop prevention)
              if (excludedBranch !== 'development') {
                await createPR('main', 'development');
              } else {
                core.info('Push originated from development (excluded). Skipping propagation back to development.');
              }
            } else if (currentBranch === 'development') {
              // development -> nightly is intentionally NOT handled here. That hop
              // is already covered by the `sync-development-to-nightly` job in
              // .github/workflows/nightly-build.yml, which runs on a daily cron
              // (09:00 UTC) and fast-forwards (or force-resets) `nightly` to match
              // `development` directly, bypassing PRs entirely. Opening a
              // PR-based development -> nightly leg here would race that cron: if
              // this leg's PR is still open when the next scheduled run fires, the
              // cron's force-push would collapse the PR's diff to zero, leaving a
              // dangling, unmergeable PR behind. See ARCHITECTURE.md's "Branch
              // Promotion Chain" section for the full picture.
              core.info('Push to development detected. Propagation to nightly is handled by the daily sync-development-to-nightly cron in nightly-build.yml, not this workflow.');
            }
