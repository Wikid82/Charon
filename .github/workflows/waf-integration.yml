name: WAF integration

# Builds the Charon image locally via the shared build-charon-image composite action (GHA layer cache), then runs the Coraza WAF integration tests.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to test (e.g., pr-123-abc1234, latest)'
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

# Prevent race conditions when PR is updated mid-test
# Cancels old test runs when new build completes with different SHA
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event || github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  waf-integration:
    name: Coraza WAF Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 20m: warm GHA cache builds in ~8-12m; first run on a fresh branch / after cache eviction is still a full cold build.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Docker image (Local)
        uses: ./.github/actions/build-charon-image

      - name: Run WAF integration tests
        id: waf-test
        run: |
          chmod +x scripts/waf_integration.sh
          scripts/waf_integration.sh 2>&1 | tee waf-test-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Dump Debug Info on Failure
        if: failure()
        run: |
          {
            echo "## 🔍 Debug Information"
            echo ""

            echo "### Container Status"
            echo '```'
            docker ps -a --filter "name=charon" --filter "name=waf" 2>&1 || true
            echo '```'
            echo ""

            echo "### Caddy Admin Config"
            echo '```json'
            curl -s http://localhost:2119/config/ 2>/dev/null | head -200 || echo "Could not retrieve Caddy config"
            echo '```'
            echo ""

            echo "### Charon Container Logs (last 100 lines)"
            echo '```'
            docker logs charon-waf-test 2>&1 | tail -100 || echo "No container logs available"
            echo '```'
            echo ""

            echo "### WAF Ruleset Files"
            echo '```'
            docker exec charon-waf-test sh -c 'ls -la /app/data/caddy/coraza/rulesets/ 2>/dev/null && echo "---" && cat /app/data/caddy/coraza/rulesets/*.conf 2>/dev/null' || echo "No ruleset files found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: WAF Integration Summary
        if: always()
        run: |
          {
            echo "## 🛡️ WAF Integration Test Results"
            if [ "${{ steps.waf-test.outcome }}" == "success" ]; then
              echo "✅ **All WAF tests passed**"
              echo ""
              echo "### Test Results:"
              echo '```'
              grep -E "^✓|^===|^Coraza" waf-test-output.txt || echo "See logs for details"
              echo '```'
            else
              echo "❌ **WAF tests failed**"
              echo ""
              echo "### Failure Details:"
              echo '```'
              grep -E "^✗|Unexpected|Error|failed" waf-test-output.txt | head -20 || echo "See logs for details"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f charon-waf-test || true
          docker rm -f waf-backend || true
          docker network rm containers_default || true
