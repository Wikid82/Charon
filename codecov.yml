# =============================================================================
# Codecov Configuration
# Require 75% overall coverage, exclude test files and non-source code
# =============================================================================

coverage:
  status:
    project:
      default:
        target: 87%
        threshold: 1%
    patch:
      default:
        # Patch coverage is a mandatory merge-blocking gate, consistent with
        # the rest of the Definition of Done (see
        # .github/instructions/testing.instructions.md §3). Target matches
        # the project coverage target / CHARON_MIN_COVERAGE default (87%)
        # for consistency across all coverage gates.
        target: 87%
        threshold: 1%

# Fail CI if Codecov upload/report indicates a problem
require_ci_to_pass: yes

# -----------------------------------------------------------------------------
# Notification gating
# -----------------------------------------------------------------------------
# Coverage is uploaded by three independent, parallel jobs in
# .github/workflows/codecov-upload.yml (flags: backend, frontend, agent).
# Without this, Codecov re-evaluates the project/patch commit statuses after
# EACH upload lands, so the first upload produces a partial report that fails
# the 87% gate — the status shows red, then flips green once the remaining
# uploads arrive. after_n_builds makes Codecov hold the status as pending
# until all 3 uploads are in, then post a single pass/fail.
#
# NOTE: on manual workflow_dispatch runs that disable a job (run_frontend=false
# etc.) fewer than 3 uploads arrive and the status stays pending. Normal
# pull_request runs always execute all 3 jobs, so this only affects ad-hoc
# manual runs.
codecov:
  notify:
    after_n_builds: 3
    wait_for_ci: yes

# -----------------------------------------------------------------------------
# PR Comment Configuration
# -----------------------------------------------------------------------------
comment:
  # Hold the PR comment until all 3 coverage uploads land, matching
  # codecov.notify.after_n_builds — avoids posting partial numbers that
  # get edited moments later.
  after_n_builds: 3
  # Post coverage report as PR comment
  require_changes: false
  require_base: false
  require_head: true
  layout: "reach, diff, flags, files"
  behavior: default

# -----------------------------------------------------------------------------
# Exclude from coverage reporting
# -----------------------------------------------------------------------------
ignore:
  # Test files
  - "**/tests/**"
  - "**/test/**"
  - "**/__tests__/**"
  - "**/test_*.go"
  - "**/*_test.go"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/vitest.config.ts"
  - "**/vitest.setup.ts"

  # E2E tests
  - "**/e2e/**"
  - "**/integration/**"

  # Documentation
  - "docs/**"
  - "*.md"

  # CI/CD & Config
  - ".github/**"
  - "scripts/**"
  - "tools/**"
  - "*.yml"
  - "*.yaml"
  - "*.json"

  # Frontend build artifacts & dependencies
  - "frontend/node_modules/**"
  - "frontend/dist/**"
  - "frontend/coverage/**"
  - "frontend/test-results/**"
  - "frontend/public/**"

  # Backend non-source files
  - "backend/cmd/seed/**"
  - "backend/data/**"
  - "backend/coverage/**"
  - "backend/bin/**"
  - "backend/*.cover"
  - "backend/*.out"
  - "backend/*.html"
  - "backend/codeql-db/**"

  # CodeQL artifacts
  - "codeql-db/**"
  - "codeql-db-*/**"
  - "codeql-agent-results/**"
  - "codeql-custom-queries-*/**"
  - "*.sarif"

  # Config files (no logic)
  - "**/tailwind.config.js"
  - "**/postcss.config.js"
  - "**/eslint.config.js"
  - "**/vite.config.ts"
  - "**/tsconfig*.json"

  # Type definitions only
  - "**/*.d.ts"

  # Import/data directories
  - "import/**"
  - "data/**"
  - ".cache/**"

  # CrowdSec config files (no logic to test)
  - "configs/crowdsec/**"

  # ==========================================================================
  # Backend packages excluded from coverage (match go-test-coverage.sh)
  # These are entrypoints and infrastructure code that don't benefit from
  # unit tests - they are tested via integration tests instead.
  # ==========================================================================

  # Main entry points (bootstrap code only)
  - "backend/cmd/api/**"
  - "agent/main.go"

  # Infrastructure packages (logging, metrics, tracing)
  # These are thin wrappers around external libraries with no business logic
  - "backend/internal/logger/**"
  - "backend/internal/metrics/**"
  - "backend/internal/trace/**"

  # Backend test utilities (test infrastructure, not application code)
  # These files contain testing helpers that take *testing.T and are only
  # callable from *_test.go files - they cannot be covered by production code
  - "backend/internal/api/handlers/testdb.go"
  - "backend/internal/api/handlers/test_helpers.go"

  # DNS provider implementations (tested via integration tests, not unit tests)
  # These are plugin implementations that interact with external DNS APIs
  # and are validated through service-level integration tests
  - "backend/pkg/dnsprovider/builtin/**"

  # ==========================================================================
  # Frontend test utilities and helpers
  # These are test infrastructure, not application code
  # ==========================================================================

  # Test setup and utilities directory
  - "frontend/src/test/**"

  # Vitest setup files
  - "frontend/vitest.config.ts"
  - "frontend/src/setupTests.ts"

  # Playwright E2E config
  - "frontend/playwright.config.ts"
  - "frontend/e2e/**"
